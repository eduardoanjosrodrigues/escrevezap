services:
  db:
    image: postgis/postgis:18-3.6-alpine
    volumes:
      - db-volume:/var/lib/postgresql
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust

  # Gateway de WhatsApp (Rust, fork ACAN-Projects/waxum). O token abre todas
  # as sessões; só o web/worker falam com ele, pela rede interna. Os
  # webhooks saem para https://escrevezap.com.br/webhook/waxum (o Waxum
  # recusa URL de rede privada), assinados com WAXUM_WEBHOOK_SECRET.
  # Cada sessão (= WhatsApp de um usuário) fica em <volume>/sessions/user_N.
  waxum:
    build: https://github.com/ACAN-Projects/waxum.git#56a91bc68ff6f0166847e454715e6374a10f1d49
    env_file:
      - .env.waxum
    environment:
      WA_RS_HOST: 0.0.0.0
      PORT: "3451"
      WHATSAPP_STORAGE_PATH: /app/whatsapp_sessions/sessions
      SQLITE_PATH: /app/whatsapp_sessions/waxum.db
      # Guarda de mensagens: dá a citação completa nas respostas (reply_to).
      MESSAGE_HISTORY_ENABLED: "true"
      # É o WhatsApp pessoal do usuário: nunca aparecer "online" sozinho (o
      # celular para de notificar) nem recusar ligações.
      PRESENCE_POLICY: manual
      AUTO_REJECT_INCOMING_CALLS: "false"
      AUTO_PRESENCE_ON_SEND: "false"
      WA_LOCATION_COUNTRY: BR
      WA_LOCATION_CODE: BR
      WA_LOCATION_CITY: SaoPaulo
      WA_LOCATION_REGION: SP
      WA_LOCATION_TZ: America/Sao_Paulo
      WA_LOCATION_LAT: "-23.55"
      WA_LOCATION_LON: "-46.63"
      RUST_LOG: waxum=info,tower_http=warn
    # Cada sessão segura 50-70 descritores; o padrão (1024) trava em ~15.
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - waxum:/app/whatsapp_sessions
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    ports:
      - 3451:3451

  redis:
    image: redis:7-alpine
    volumes:
      - redis-volume:/var/lib/redis/data

volumes:
  redis-volume:
  waxum:
  db-volume: