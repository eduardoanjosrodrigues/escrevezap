services:

  web:
    build: .
    volumes:
      - storage-volume:/rails/storage
    env_file:
      - .env.production
    depends_on:
      - db
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    restart: unless-stopped
    # Usado pelo deploy.sh: o container novo só recebe tráfego no lugar do
    # antigo depois que o Puma responde de verdade (não só o Thruster).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/up"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 120s
      start_interval: 2s
    # "edge" é a rede que o cloudflared enxerga. O deploy.sh tira o container
    # novo dela até o Puma estar pronto, para o túnel não mandar tráfego para
    # um container que ainda está subindo.
    networks:
      - default
      - edge

  worker:
    build: .
    command: ["./bin/jobs", "start"]
    volumes:
      - storage-volume:/rails/storage
    env_file:
      - .env.production
    depends_on:
      - db
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    restart: unless-stopped

  db:
    image: postgis/postgis:18-3.6-alpine
    volumes:
      - db-volume:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-volume:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    restart: unless-stopped

  waha:
    image: devlikeapro/waha
    env_file:
      - .env.waha
    volumes:
      - waha-media:/waha/media
    depends_on:
      - redis
      - db-waha
    networks:
      - default
      - edge
    restart: unless-stopped

  db-waha:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: waha
      POSTGRES_USER: waha
      POSTGRES_PASSWORD: changeme
    volumes:
      - db-waha-volume:/var/lib/postgresql/data
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    networks:
      - edge
    environment:
      - TUNNEL_TOKEN=eyJhIjoiNGJiN2RkY2JhMTMyMjg1NmVlNWMzNzViMzBmZWMzOTIiLCJ0IjoiODA5ZDVkYTgtM2E3Mi00MjFjLWI0MWItNGVjZjAwYWUyNjQyIiwicyI6Ik9UaGlNRFExWXpFdE5XWTFaUzAwTW1SbExXSmxOV0V0Wm1NNE4yRmhabVZrT0RrNCJ9
    restart: unless-stopped

